# Better prefix: Ctrl+a (easier than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows/panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Easy splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# Navigate panes with Alt+arrows (no prefix needed!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize mode (prefix + r), then h/j/k/l to resize, Escape to exit
bind r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# Mouse support (scroll, click, resize)
set -g mouse on

# Don't rename windows automatically
set -g allow-rename off

# Fast escape (for vim)
set -sg escape-time 0

# Colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar (Gruvbox Dark — powerline style)
# Palette:
#   bg0=#1d2021  bg1=#282828  bg2=#3c3836  bg3=#504945
#   fg=#ebdbb2   muted=#a89984
#   red=#fb4934  green=#b8bb26  yellow=#fabd2f
#   blue=#83a598  purple=#d3869b  aqua=#8ec07c  orange=#fe8019
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style bg='#1d2021',fg='#a89984'

# Left: session name in a green pill
set -g status-left-length 40
set -g status-left "#[fg=#1d2021,bg=#b8bb26,bold]  #S #[fg=#b8bb26,bg=#1d2021,nobold]"

# Right: battery → date → time → prefix indicator
set -g status-right-length 150
set -g status-right "#[fg=#504945,bg=#1d2021]#[fg=#d3869b,bg=#504945] #($DOT_FILES/scripts/tmux-battery.sh)#[fg=#fabd2f,bg=#504945]#[fg=#1d2021,bg=#fabd2f] 󰃭 %d/%m/%y %a #[fg=#fe8019,bg=#fabd2f]#[fg=#1d2021,bg=#fe8019,bold]  %H:%M #{?client_prefix,#[fg=#fabd2f]#[bg=red] ☭ #[default],}"

# Windows: inactive subtle, active in a yellow pill
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a89984,bg=#1d2021]  #I·#W  "
setw -g window-status-current-format "#[fg=#1d2021,bg=#fabd2f]#[fg=#1d2021,bg=#fabd2f,bold] #I·#W #[fg=#fabd2f,bg=#1d2021]"
setw -g window-status-activity-style fg='#fe8019',bg='#1d2021'

# Bell-driven attention: kiro-cli emits BEL when it wants you.
# In-tmux: the window flashes red in the status bar.
# Away: alert-bell hook fires a macOS popup (skipped if terminal is frontmost).
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g window-status-bell-style 'fg=#1d2021,bg=#fb4934,bold'
set-hook -g alert-bell 'run-shell -b "$DOT_FILES/scripts/tmux-bell-notify.sh"'

# Pane borders
set -g pane-border-style fg='#3c3836'
set -g pane-active-border-style fg='#fabd2f'

# Messages (command line / display messages)
set -g message-style bg='#fabd2f',fg='#1d2021',bold
set -g message-command-style bg='#fabd2f',fg='#1d2021'

# Reload config with R
bind R source-file ~/.tmux.conf \; display "Reloaded!"

# Kill pane without confirmation
bind x kill-pane

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Alt+Tab: swap between last windows (no prefix needed)
bind -n M-Tab last-window

# Alt+h / Alt+l: previous / next window (no prefix needed)
bind -n M-h previous-window
bind -n M-l next-window

# Alt+z: toggle pane zoom (fullscreen current pane, no prefix needed)
bind -n M-z resize-pane -Z

# navi cheatsheets: prefix + C-g opens a popup; the chosen snippet is typed into
# the pane underneath without Enter. Cheats live in $DOT_FILES/.config/navi/cheats
bind-key -N "navi cheatsheets" C-g run-shell 'tmux display-popup -E -w 80% -h 60% -T " navi " "out=\$(navi --print) && printf %s \"\$out\" | tmux load-buffer -b navi - && tmux paste-buffer -d -b navi -t #{pane_id}"'

run '~/.tmux/plugins/tpm/tpm'
